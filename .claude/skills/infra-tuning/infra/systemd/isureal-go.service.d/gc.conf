# isureal-go: GC の頻度を下げる（#92。asia1 は CPU 97〜99% で GC 分を削りたい）
# GOGC=200: ヒープが生存量の 3 倍になるまで GC しない（既定 100 = 2 倍）。RSS 500MB 前後なら 1.5GB 程度までの想定
# GOMEMLIMIT=2GiB: 4GB 機（nginx と OS で約 1GB 使う）で OOM にしないための上限。超えそうなら GC が頻度を上げる
# 効けば GOGC=400 まで上げる（その場合も GOMEMLIMIT が上限として効く）
# 配置（asia1 / europe1 / america1 に同じ内容。asia2 は isureal-go を使わないので不要）:
#   sudo install -m 644 -D gc.conf /etc/systemd/system/isureal-go.service.d/gc.conf && sudo systemctl daemon-reload && sudo systemctl restart isureal-go
# 戻し方: sudo rm /etc/systemd/system/isureal-go.service.d/gc.conf && sudo systemctl daemon-reload && sudo systemctl restart isureal-go
# 確認: systemctl show isureal-go -p Environment（env.sh の中身は表示しない）
[Service]
Environment=GOGC=200
Environment=GOMEMLIMIT=2GiB
