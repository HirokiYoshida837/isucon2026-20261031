# isureal-go: アクションログを 5xx だけにする（ISUREAL_LOG_LEVEL=error。info = POST 等、debug = GET を journald に書かない）
# 背景: IP BAN はアプリ内判定（ISUREAL_GUARD_INAPP=1）なので journald のアクションログは読まれていない。asia1 で 5 分 1.3 万行
# 配置: sudo install -m 644 -D loglevel.conf /etc/systemd/system/isureal-go.service.d/loglevel.conf && sudo systemctl daemon-reload（次の restart から効く）
# 戻し方: sudo rm /etc/systemd/system/isureal-go.service.d/loglevel.conf && sudo systemctl daemon-reload && sudo systemctl restart isureal-go
# 注意: env.sh に ISUREAL_LOG_LEVEL があればそちらが勝つ（EnvironmentFile が Environment= を上書きする）
[Service]
Environment=ISUREAL_LOG_LEVEL=error
