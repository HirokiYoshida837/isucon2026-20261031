# PostgreSQL 16（asia2）の WAL バッファと walwriter（#234）
# 狙い: 画像 INSERT（1 回 535KB の WAL）が同時に 10〜20 本走ると 16MB の wal_buffers が埋まり、backend が自分で
#       WAL を書く（WALWriteLock で直列化）。バッファを広げ、walwriter に早く書かせて backend の待ちを減らす
# 根拠: pg_stat_wal（10-30 11:59 UTC〜）wal_buffers_full 1,581,934 / wal_write 1,693,683 / wal_bytes 42GB
# 配置: sudo install -m 644 -o postgres -g postgres 99-wal.conf /etc/postgresql/16/main/conf.d/99-wal.conf
#       wal_writer_* は sudo systemctl reload postgresql で効く
#       wal_buffers は sudo systemctl restart postgresql が要る（16:30 の再起動試験に合わせる）
# 確認: sudo -u postgres psql -Atc "select name, setting, unit, pending_restart from pg_settings where name like 'wal_buffers' or name like 'wal_writer%'"
# 効果: ベンチ前後で select wal_buffers_full, wal_write from pg_stat_wal の増分が減ること
# 戻し方: sudo rm /etc/postgresql/16/main/conf.d/99-wal.conf && sudo systemctl restart postgresql
# 注意: ファイル名は 99-isucon-tuning.conf（wal_buffers = 16MB）より後に読まれる名前にしている（conf.d は名前順で後勝ち）
#       shared_buffers 1GB の外に 128MB 取る。asia2 は RAM 3.7GB・available 2.0GB（16:25 JST）
#       永続性（fsync・full_page_writes・synchronous_commit）は変えない

wal_buffers = 128MB
wal_writer_delay = 10ms
wal_writer_flush_after = 8MB
