# PostgreSQL 16（asia2）のスロークエリログから bind パラメータの全文出力を外す
# 狙い: log_min_duration_statement=100ms に掛かる create_post（平均 511ms）が、画像 bytea（約 500KB）を hex で
#       1 行 1.7MB の "DETAIL: parameters:" として毎回ログに書いていた。ログは 9.8GB、直近 2GB の 99.8% がこの行。
#       DB と同じ NVMe への書き込みと hex 変換の CPU を止める。duration 行（文とミリ秒）はそのまま残る
# 根拠: /var/log/postgresql/postgresql-16-main.log 9,297,147,630 bytes（10-31 07:01 UTC）。
#       tail -c 2GB | grep "parameters:" の合計 1,996,738,402 bytes
# 配置: sudo install -m 644 -o postgres -g postgres 96-log-params.conf /etc/postgresql/16/main/conf.d/96-log-params.conf
#       sudo systemctl reload postgresql   （SIGHUP で効く。再起動不要）
# 確認: sudo -u postgres psql -Atc "select name, setting from pg_settings where name like 'log_parameter%'"
# 戻し方: sudo rm /etc/postgresql/16/main/conf.d/96-log-params.conf && sudo systemctl reload postgresql
# 注意: 既にある 9.8GB のログは別途 truncate する（sudo truncate -s 0 /var/log/postgresql/postgresql-16-main.log）

log_parameter_max_length = 256
