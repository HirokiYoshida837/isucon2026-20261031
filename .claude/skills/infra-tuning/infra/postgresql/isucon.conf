# PostgreSQL 16（asia2: RAM 3.8GB, 2 vCPU, EBS）の秘伝のタレ
# 配置: sudo install -m 644 -o postgres -g postgres isucon.conf /etc/postgresql/16/main/conf.d/90-isucon.conf
#       sudo systemctl restart postgresql   （shared_buffers / max_connections / shared_preload_libraries / ssl は再起動が必要）
#       sudo -u postgres psql -d isureal -c 'CREATE EXTENSION IF NOT EXISTS pg_stat_statements;'
# 戻し方: sudo rm /etc/postgresql/16/main/conf.d/90-isucon.conf && sudo systemctl restart postgresql
# 注意: 配布の conf.d/isucon.conf（listen_addresses='*'）は触らない。ファイル名の 90- は後勝ちにするため

# メモリ。DB は 16GB（画像 14GB）だが、画像以外のホットなテーブルは約 2GB
shared_buffers = 1GB
effective_cache_size = 2560MB
work_mem = 16MB
maintenance_work_mem = 256MB

# 接続。アプリ 3 台 × 30 ＋ guard 3 で 100 ぎりぎりだった
max_connections = 300
ssl = off

# チェックポイント。WAL 起因のチェックポイント（checkpoints_req 36 vs timed 10）が多く、
# backend が自分でページを吐いていた（buffers_backend 730 万）
max_wal_size = 8GB
min_wal_size = 1GB
checkpoint_timeout = 30min
checkpoint_completion_target = 0.9
wal_compression = lz4

# EBS SSD
random_page_cost = 1.1
effective_io_concurrency = 200

# 小さいクエリが大量なので JIT は切る
jit = off

# 書き込み。クラッシュ時に直近の数百 ms を失う可能性がある。通常の再起動（clean shutdown）では失わない
synchronous_commit = off

# 計測。スロークエリログは 10-31 07:12 UTC に止めた（SQL は pg_stat_statements と NewRelic で見る）
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
log_min_duration_statement = -1
log_checkpoints = on
