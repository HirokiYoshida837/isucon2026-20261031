# PostgreSQL 16（asia2）の bgwriter 強化（#188）
# 狙い: ダーティページの書き出しを bgwriter に寄せ、画像 INSERT（1MB/回）を処理している backend が
#       buffer eviction で自分で書き出す時間（shared_blks_written 72 ページ/回・平均 510ms）を減らす
# 根拠: pg_stat_bgwriter で buffers_backend 971 万 / buffers_clean 170 万、maxwritten_clean 13,868
#       （bgwriter が lru_maxpages=100 の上限に当たって止まった回数）
# 配置: sudo install -m 644 -o postgres -g postgres 95-bgwriter.conf /etc/postgresql/16/main/conf.d/95-bgwriter.conf
#       sudo systemctl reload postgresql   （全部 SIGHUP で効く。再起動不要）
# 確認: sudo -u postgres psql -Atc "select name, setting from pg_settings where name like 'bgwriter%'"
# 戻し方: sudo rm /etc/postgresql/16/main/conf.d/95-bgwriter.conf && sudo systemctl reload postgresql
# 注意: 99-isucon-tuning.conf は bgwriter を設定していないので後勝ちの影響なし

bgwriter_delay = 20ms
bgwriter_lru_maxpages = 1000
bgwriter_lru_multiplier = 4.0
