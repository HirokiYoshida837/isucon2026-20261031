# PostgreSQL 16（asia2）: NewRelic 以外のログ出力を止める（チェックポイントのログ）。reload で効く
# 配置: sudo install -m 644 -o postgres -g postgres 97-log-off.conf /etc/postgresql/16/main/conf.d/97-log-off.conf && sudo systemctl reload postgresql
# 戻し方: sudo rm /etc/postgresql/16/main/conf.d/97-log-off.conf && sudo systemctl reload postgresql
log_checkpoints = off
