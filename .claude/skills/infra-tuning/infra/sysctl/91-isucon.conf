# ISUReal（ISUCON2026）当日追記の sysctl。主催者配布の /etc/sysctl.d/90-isucon.conf（ip_local_port_range 等）は触らない
# 用途: SYN 待ち行列と NIC 受信待ち行列を広げ、FIN_WAIT_2 を早く解放する（既定 256 / 1000 / 60）
# 配置先: /etc/sysctl.d/91-isucon.conf（scripts/os-quiet.sh が install する）。反映: sudo sysctl --system
# 戻し方: sudo rm /etc/sysctl.d/91-isucon.conf && sudo sysctl --system（os-quiet.sh --restore でも同じ）
net.ipv4.tcp_max_syn_backlog = 8192
net.core.netdev_max_backlog = 8192
net.ipv4.tcp_fin_timeout = 10
