# upstream との keep-alive を有効にする断片。location 内で include する。
#   location /api/ { include /etc/nginx/isucon/proxy_keepalive.conf; proxy_pass http://app; }
# upstream ブロック側の keepalive と必ずセットで使う。

# keep-alive は HTTP/1.1 が必要（nginx の proxy は既定で 1.0 を使う）。
proxy_http_version 1.1;
# Connection: close を消して接続を使い回す。毎リクエストの TCP 接続が無くなる。
proxy_set_header Connection "";

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
