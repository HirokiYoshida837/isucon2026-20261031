# ISUReal のサイト設定（配布の /etc/nginx/sites-enabled/isureal.conf に差分を足したもの）
# 配置: cd ~/webapp/.claude/skills/infra-tuning/infra/scripts && ./apply-site.sh ../nginx/sites-available/isureal.conf
# 足したもの: upstream keep-alive、SSE（/api/notifications）のバッファ無効化と長いタイムアウト、署名つき画像の 3 秒キャッシュ（サーバーで先に当てていたものを取り込み）
# 変えていないもの: listen、root、client_max_body_size、try_files、X-Client-IP（ルーターが付けるヘッダーはそのまま透過）

proxy_cache_path /var/cache/nginx/images levels=1:2 keys_zone=images:10m max_size=256m inactive=10s use_temp_path=off;

upstream app {
  server 127.0.0.1:8080;
  keepalive 128;
  keepalive_requests 10000;
  keepalive_timeout 60s;
}

server {
  listen 80 default_server;
  server_name _;
  client_max_body_size 32m;
  root /home/isucon/webapp/public;

  # SSE。nginx のデフォルト proxy_read_timeout 60s で切れていた（error.log に upstream timed out）
  location = /api/notifications {
    include /etc/nginx/isucon/proxy_keepalive.conf;
    proxy_pass http://app;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    gzip off;
  }

  # 署名つき画像: 同一 URL・同一 IP の短時間の再取得だけ 3 秒キャッシュ（削除猶予 5 秒未満）。403 等は保持しない
  location /api/images/ {
    include /etc/nginx/isucon/proxy_keepalive.conf;
    proxy_pass http://app;
    proxy_cache images;
    proxy_cache_key "$http_x_client_ip$request_uri";
    proxy_cache_valid 200 3s;
    proxy_cache_lock on;
    proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
  }

  location /api/ {
    include /etc/nginx/isucon/proxy_keepalive.conf;
    proxy_pass http://app;
  }

  location / {
    try_files $uri /index.html;
  }
}
