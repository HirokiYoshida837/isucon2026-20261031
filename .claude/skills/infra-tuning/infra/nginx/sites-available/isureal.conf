# ISUReal のサイト設定（配布の /etc/nginx/sites-enabled/isureal.conf に差分を足したもの）
# 配置: cd /home/isucon/infra/scripts && ./apply-site.sh ~/webapp/.claude/skills/infra-tuning/infra/nginx/sites-available/isureal.conf
# 足したもの: upstream keep-alive、SSE（/api/notifications）のバッファ無効化と長いタイムアウト
# 変えていないもの: listen、root、client_max_body_size、try_files、X-Client-IP（ルーターが付けるヘッダーはそのまま透過）

upstream app {
  server 127.0.0.1:8080;
  keepalive 128;
  keepalive_requests 10000;
  keepalive_timeout 60s;
}

server {
  listen 80 default_server;
  server_name _;
  client_max_body_size 32m;
  root /home/isucon/webapp/public;

  # SSE。nginx のデフォルト proxy_read_timeout 60s で切れていた（error.log に upstream timed out）
  location = /api/notifications {
    include /etc/nginx/isucon/proxy_keepalive.conf;
    proxy_pass http://app;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    gzip off;
  }

  location /api/ {
    include /etc/nginx/isucon/proxy_keepalive.conf;
    proxy_pass http://app;
  }

  location / {
    try_files $uri /index.html;
  }
}
