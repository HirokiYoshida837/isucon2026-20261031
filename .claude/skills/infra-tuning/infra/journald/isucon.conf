# journald: rsyslog への転送を止め、レート制限を外す（アプリのアクションログを捨てさせない。isureal-guard がこのログで BAN を判定する）
# 配置: sudo install -m 644 -D isucon.conf /etc/systemd/journald.conf.d/isucon.conf && sudo systemctl restart systemd-journald
# 戻し方: sudo rm /etc/systemd/journald.conf.d/isucon.conf && sudo systemctl restart systemd-journald
[Journal]
ForwardToSyslog=no
RateLimitIntervalSec=0
RateLimitBurst=0
SystemMaxUse=1G
